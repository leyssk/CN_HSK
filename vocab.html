<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຄຳສັບ HSK - TC Leyssk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="app-icon.png">
    <link rel="apple-touch-icon" href="app-icon.png">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <div class="logo-area" onclick="location.href='index.html'" style="cursor:pointer;">
                <img src="app-icon.png" class="app-logo-img" alt="Logo">
                <h2>TC Leyssk HSK</h2>
            </div>
            <nav class="desktop-nav">
                <a href="index.html"><i class="fa-solid fa-house"></i> ໜ້າຫຼັກ</a>
                <a href="vocab.html" class="active"><i class="fa-solid fa-book"></i> ຄຳສັບ HSK</a>
                <a href="quiz.html"><i class="fa-solid fa-gamepad"></i> ເກມ Quiz</a>
                <a href="about.html"><i class="fa-solid fa-circle-info"></i> ກ່ຽວກັບ</a>
            </nav>
            <div class="user-profile-widget">
                <span id="userStatusText">👤 ແຂກ</span>
                <button class="btn-sm btn-auth-trigger" onclick="openAuthModal()">🔐 ລັອກອິນ</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchBox" class="search-input" placeholder="ຄົ້ນຫາຄຳສັບ (ຈີນ, ພິນອິນ, ລາວ)..." onkeyup="renderTable()">
        </div>

        <div class="filter-bar">
            <button class="btn-filter active" onclick="filterByCat('')">ທັງໝົດ</button>
            <button class="btn-filter" onclick="filterByCat('HSK1')">HSK 1</button>
            <button class="btn-filter" onclick="filterByCat('HSK2')">HSK 2</button>
            <button class="btn-filter" onclick="filterByCat('HSK3')">HSK 3</button>
            <button class="btn-filter" onclick="filterByCat('HSK4')">HSK 4</button>
            <button class="btn-filter" onclick="filterByCat('HSK5')">HSK 5</button>
            <button class="btn-filter" onclick="filterByCat('HSK6')">HSK 6</button>
        </div>

        <div class="vocab-section">
            <div class="upload-box">
                <h4>📁 ຈັດການຂໍ້ມູນຄຳສັບ CSV</h4>
                <div class="upload-controls">
                    <input type="file" id="csvFileInput" accept=".csv">
                    <button class="btn btn-primary" onclick="uploadCSV()">📥 ອັບໂຫຼດ CSV</button>
                    <button class="btn btn-danger" onclick="clearData()">🗑️ ລ້າງຂໍ້ມູນ</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Emoji</th>
                            <th>ຕົວຈີນ</th>
                            <th>ພິນອິນ</th>
                            <th>ຄຳແປລາວ</th>
                            <th>ໝວດໝູ່</th>
                            <th>🔊 ຟັງສຽງ</th>
                        </tr>
                    </thead>
                    <tbody id="vocabTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-box">
            <span class="close-modal" onclick="closeAuthModal()">&times;</span>
            <div class="auth-tabs">
                <button id="tabLoginBtn" class="auth-tab-btn active" onclick="switchAuthTab('login')">ເຂົ້າສູ່ລະບົບ</button>
                <button id="tabRegisterBtn" class="auth-tab-btn" onclick="switchAuthTab('register')">ລົງທະບຽນ</button>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="loginUser" placeholder="ຊື່ຜູ້ໃຊ້ / Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPass" placeholder="ລະຫັດຜ່ານ" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">ເຂົ້າສູ່ລະບົບ</button>
            </form>
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="text" id="regUser" placeholder="ຊື່ຜູ້ໃຊ້ / Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="regPass" placeholder="ລະຫັດຜ່ານ" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">ລົງທະບຽນບັນຊີໃໝ່</button>
            </form>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>ໜ້າຫຼັກ</span></a>
        <a href="vocab.html" class="nav-item active"><i class="fa-solid fa-book"></i><span>ຄຳສັບ</span></a>
        <a href="quiz.html" class="nav-item"><i class="fa-solid fa-gamepad"></i><span>Quiz</span></a>
        <a href="about.html" class="nav-item"><i class="fa-solid fa-circle-info"></i><span>ກ່ຽວກັບ</span></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
